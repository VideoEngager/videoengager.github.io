<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- ABC Federal Credit Union — "Connecting to a Live Agent…" holding screen, 16:9. Static equivalent of connecting.html. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6F8"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Arial, sans-serif">
    <!-- logo mark -->
    <g transform="translate(300 218) scale(2.8)">
      <rect width="40" height="40" rx="9" fill="#0B3D5C"/>
      <path d="M8 27 C14 12, 26 12, 32 27" stroke="#1B9AAA" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M12 29 C16.5 19, 23.5 19, 28 29" stroke="#E0A526" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="30" r="2.6" fill="#fff"/>
    </g>
    <!-- wordmark -->
    <text x="438" y="268" font-size="46" font-weight="800" fill="#0B3D5C" letter-spacing="-0.3">ABC Federal Credit Union</text>
    <text x="440" y="306" font-size="18" font-weight="600" fill="#137F8D" letter-spacing="2">MEMBER BANKING SINCE 1954</text>
    <!-- message -->
    <text x="640" y="452" text-anchor="middle" font-size="30" font-weight="600" fill="#0B3D5C">Connecting to a Live Agent…</text>
    <!-- footer -->
    <text x="640" y="672" text-anchor="middle" font-size="14" fill="#7E8B96" letter-spacing="0.3">Secure member session · this session may be recorded</text>
  </g>
</svg>
