<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Resolution Confirmation</title>
  <style>
    :root {
      --navy-950: #06233f;
      --navy-900: #073763;
      --blue-700: #075ea8;
      --ink: #172533;
      --muted: #647381;
      --line: #dbe3e9;
      --surface: #ffffff;
      --yes: #16764a;
      --yes-soft: #ecf8f2;
      --no: #425466;
      --no-soft: #f3f6f8;
      --focus: #f5b335;
      --shadow: 0 24px 70px rgba(6, 35, 63, 0.13);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(7, 94, 168, 0.08), transparent 30rem),
        linear-gradient(180deg, #f8fafc 0%, #f2f6f9 100%);
    }

    button { font: inherit; cursor: pointer; }

    .card {
      width: min(100%, 520px);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(11, 55, 91, 0.11);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }

    .card-accent {
      height: 6px;
      background: linear-gradient(90deg, #073763, #1f81c3 68%, #6db5df);
    }

    .panel {
      min-height: 380px;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: clamp(32px, 6vw, 56px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--blue-700);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 480px;
      margin: 0;
      color: var(--navy-950);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 750;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .supporting {
      max-width: 400px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.6vw, 1.05rem);
      line-height: 1.5;
    }

    .choices {
      width: min(100%, 400px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 32px;
    }

    .choice {
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      border: 2px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--navy-950);
      font-size: 1.2rem;
      font-weight: 700;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease, box-shadow 150ms ease;
    }

    .choice:hover {
      transform: translateY(-2px);
      border-color: #79a9ca;
      box-shadow: 0 10px 25px rgba(6, 35, 63, 0.09);
    }

    .choice:active { transform: translateY(0); }

    .choice:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 4px;
    }

    .choice-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
    }

    .choice--yes .choice-icon {
      color: var(--yes);
      background: var(--yes-soft);
    }

    .choice--no .choice-icon {
      color: var(--no);
      background: var(--no-soft);
    }

    .choice--yes:hover {
      color: var(--yes);
      border-color: var(--yes);
      background: var(--yes-soft);
    }

    .choice--no:hover {
      color: var(--no);
      border-color: var(--no);
      background: var(--no-soft);
    }

    .privacy-note {
      margin: 20px 0 0;
      color: #7b8792;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    /* ── Result state ── */
    .result-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 50%;
      color: #fff;
      background: var(--yes);
      box-shadow: 0 16px 34px rgba(22, 118, 74, 0.22);
      font-size: 2.2rem;
      font-weight: 750;
    }

    .result-icon[data-result="no"] {
      background: var(--blue-700);
      box-shadow: 0 16px 34px rgba(7, 94, 168, 0.2);
    }

    .result-title {
      font-size: clamp(1.5rem, 3.2vw, 2.2rem);
    }

    .btn-close {
      margin-top: 28px;
      padding: 12px 32px;
      border: none;
      border-radius: 100px;
      background: var(--navy-900);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background 150ms ease, transform 150ms ease;
    }

    .btn-close:hover {
      background: var(--navy-950);
      transform: translateY(-1px);
    }

    .btn-close:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: 4px;
    }

    [hidden] { display: none !important; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .panel { min-height: 340px; padding: 28px 18px; }
      .choices { grid-template-columns: 1fr; margin-top: 24px; }
      .choice { min-height: 68px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-accent" aria-hidden="true"></div>

    <!-- ─── QUESTION PANEL ─── -->
    <div class="panel" id="question-panel">
      <p class="eyebrow">Before we finish</p>
      <h1><span id="member-prefix" hidden></span>Was your issue resolved during this session?</h1>
      <p class="supporting">Choose the answer that best reflects your experience today.</p>

      <div class="choices" role="group" aria-label="Resolution confirmation">
        <button class="choice choice--yes" type="button" data-answer="yes">
          <span class="choice-icon" aria-hidden="true">✓</span>
          <span>Yes</span>
        </button>
        <button class="choice choice--no" type="button" data-answer="no">
          <span class="choice-icon" aria-hidden="true">×</span>
          <span>No</span>
        </button>
      </div>

      <p class="privacy-note">Your response helps us understand the outcome of this support session.</p>
    </div>

    <!-- ─── RESULT PANEL ─── -->
    <div class="panel" id="result-panel" hidden>
      <div class="result-icon" id="result-icon" aria-hidden="true">✓</div>
      <p class="eyebrow">Response received</p>
      <h1 class="result-title" id="result-title">Thank you.</h1>
      <p class="supporting" id="result-message"></p>
      <button class="btn-close" id="close-btn">Close window</button>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const memberName = (params.get('name') || '').trim().slice(0, 40);

      const questionPanel = document.getElementById('question-panel');
      const resultPanel = document.getElementById('result-panel');
      const memberPrefix = document.getElementById('member-prefix');
      const resultIcon = document.getElementById('result-icon');
      const resultTitle = document.getElementById('result-title');
      const resultMessage = document.getElementById('result-message');
      const closeBtn = document.getElementById('close-btn');
      const choices = [...document.querySelectorAll('[data-answer]')];

      if (memberName) {
        memberPrefix.textContent = `${memberName}, `;
        memberPrefix.hidden = false;
      }

      // ── Close the popup ──
      function closePopup() {
        window.close();
        // Fallback: if window.close() fails (not a popup), hide card
        setTimeout(() => {
          if (!window.closed) {
            document.querySelector('.card').style.display = 'none';
            document.body.innerHTML = `<p style="color:#647381;text-align:center;padding:40px;font-family:sans-serif;">Window closed. You may close this tab.</p>`;
          }
        }, 300);
      }

      // ── Show result ──
      function showResult(answer, notify = true) {
        const resolved = answer === 'yes';

        questionPanel.hidden = true;
        resultPanel.hidden = false;
        resultIcon.dataset.result = answer;
        resultIcon.textContent = resolved ? '✓' : 'i';
        resultTitle.textContent = memberName ? `Thank you, ${memberName}.` : 'Thank you.';
        resultMessage.textContent = resolved
          ? 'We\'re glad we could resolve this with you.'
          : 'Your specialist will continue with you to determine the next step.';
        closeBtn.focus({ preventScroll: true });

        if (notify) {
          const detail = { answer, timestamp: new Date().toISOString() };
          window.dispatchEvent(new CustomEvent('ve:resolution-response', { detail }));
          if (window.parent !== window) {
            window.parent.postMessage({ type: 've:resolution-response', ...detail }, window.location.origin);
          }
        }

        // Auto-close after 3 seconds (demo-friendly)
        setTimeout(closePopup, 2800);
      }

      // ── Reset ──
      function reset() {
        resultPanel.hidden = true;
        questionPanel.hidden = false;
        choices[0].focus({ preventScroll: true });
      }

      // ── Events ──
      choices.forEach((button) => {
        button.addEventListener('click', () => showResult(button.dataset.answer));
      });

      closeBtn.addEventListener('click', closePopup);

      document.addEventListener('keydown', (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        const key = event.key.toLowerCase();
        if (key === 'y') showResult('yes');
        if (key === 'n') showResult('no');
        if (key === 'escape') {
          if (resultPanel.hidden) {
            // Close immediately if still on question
            closePopup();
          } else {
            reset();
          }
        }
      });

      // ── Preset via URL ──
      const preset = (params.get('result') || '').toLowerCase();
      if (preset === 'yes' || preset === 'no') {
        showResult(preset, false);
      }

    })();
  </script>
</body>
</html>
