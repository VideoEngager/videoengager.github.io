<!DOCTYPE html>
<html lang="en">
<head>
  <title>Join Video Call</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      overflow-y: auto;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #f8fafc;
      font-family: 'DM Sans', sans-serif;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 48px 40px 40px;
      width: 100%; max-width: 380px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05), 0 16px 40px rgba(0,0,0,0.08);
      text-align: center;
    }
    .icon {
      width: 52px; height: 52px;
      background: #eff6ff;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg { width: 26px; height: 26px; color: #3b82f6; }
    h1 { font-size: 20px; font-weight: 600; color: #0f172a; margin-bottom: 8px; }
    p  { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 32px; }
    label {
      display: block; text-align: left;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #94a3b8; margin-bottom: 8px;
    }
    #pin {
      width: 100%; height: 56px;
      font-family: 'DM Mono', monospace;
      font-size: 26px; font-weight: 500;
      letter-spacing: 0.5em; text-indent: 0.25em;
      text-align: center;
      color: #0f172a;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 12px;
    }
    #pin:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
      background: white;
    }
    #pin.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }
    .error-msg {
      font-size: 13px; color: #ef4444;
      min-height: 18px; margin-bottom: 16px;
      text-align: left;
    }
    #captcha-container {
      display: none; justify-content: center;
      margin-bottom: 16px;
    }
    #captcha-container.show { display: flex; }
    button {
      width: 100%; height: 50px;
      background: #3b82f6; color: white;
      border: none; border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    button:hover:not(:disabled) { background: #2563eb; }
    button:active:not(:disabled) { transform: scale(0.99); }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .spinner {
      display: none; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.loading .spinner { display: block; }
    .footer { margin-top: 24px; font-size: 12px; color: #94a3b8; }
    .footer a { color: #3b82f6; text-decoration: none; }
/* Aggressive compression for mobile landscape & short screens */
    @media (max-height: 500px) {
          body          { padding: 12px; }
          .card         { padding: 16px 24px; max-width: 480px; }
          
          /* Hide non-essential vertical elements */
          .icon, .footer { display: none; } 
          
          /* Compress text and margins */
          h1            { font-size: 16px; margin-bottom: 2px; }
          p             { font-size: 13px; margin-bottom: 8px; }
          label         { margin-bottom: 4px; }
          
          /* Shrink inputs and buttons */
          #pin          { height: 42px; font-size: 20px; margin-bottom: 4px; }
          .error-msg    { margin-bottom: 4px; min-height: 16px; font-size: 12px;}
          button        { height: 42px; font-size: 14px; }
          
          /* Scale down the reCAPTCHA to save vertical space */
          #captcha-container { 
            transform: scale(0.85); 
            transform-origin: top center; 
            margin-bottom: 4px; 
            height: 66px; /* reCAPTCHA is natively 78px tall, scaling requires manual height adjustment */
          }
        }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
      </svg>
    </div>
    <h1>Join your video call</h1>
    <p>Enter the   PIN your agent provided.</p>
    <label for="pin">PIN</label>
    <input id="pin" type="text" inputmode="numeric"  minlength="4" maxlength="6" pattern="\d{4,6}" placeholder="0000" autocomplete="off" autofocus />
    <div class="error-msg" id="errorMsg"></div>
    <div id="captcha-container">
      <!-- GOOGLE RECAPTCHA PLACEHOLDER -->
      <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
    </div>
    <button id="join">
      <span class="spinner"></span>
      <span id="btnLabel">Join video call</span>
    </button>
  </div>
  <div class="footer">Powered by <a href="https://videoengager.com" target="_blank">VideoEngager</a></div>

  <script>
    const pin      = document.getElementById('pin');
    const btn      = document.getElementById('join');
    const errMsg   = document.getElementById('errorMsg');
    const captcha  = document.getElementById('captcha-container');
    const btnLabel = document.getElementById('btnLabel');
    let failed     = 0;

    pin.addEventListener('input', () => {
      pin.value = pin.value.replace(/\D/g, '');
      pin.classList.remove('error');
      errMsg.textContent = '';
    });

    pin.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click(); });

    btn.addEventListener('click', async () => {
      const code = pin.value.trim();
      if (code.length < 4 || code.length > 6) { showError('Please enter a valid PIN.'); return; }

      if (failed >= 3) {
        const token = typeof grecaptcha !== 'undefined' ? grecaptcha.getResponse() : '';
        if (!token) { showError('Please complete the CAPTCHA.'); return; }
      }

      setLoading(true);

      const serverURL = 'https://videome.leadsecure.com';
      const headers   = { 'Accept': 'application/json' };
      if (failed >= 3 && typeof grecaptcha !== 'undefined') {
        const t = grecaptcha.getResponse();
        if (t) headers['x-recaptcha-response'] = t;
      }

      try {
        const res = await fetch(serverURL + '/api/shorturls/pin/' + encodeURIComponent(code), { headers });
        if (!res.ok) throw res;
        const data = await res.json();
        btnLabel.textContent = 'Connecting...';
        window.location.href = serverURL + data.shortUrl;
      } catch (err) {
        failed++;
        if (failed >= 3) {
          captcha.classList.add('show');
          if (typeof grecaptcha !== 'undefined') grecaptcha.reset();
        }
        const status = err.status || 0;
        if      (status === 404)                    showError('Invalid or expired PIN. Check with your agent.');
        else if (status === 403 || status === 429)  showError('Too many attempts. Please complete the CAPTCHA.');
        else                                        showError('Something went wrong. Please try again.');
        setLoading(false);
      }
    });

    function showError(msg) {
      errMsg.textContent = msg;
      pin.classList.add('error');
      pin.value = '';
      pin.focus();
    }

    function setLoading(on) {
      btn.classList.toggle('loading', on);
      btn.disabled = on;
      if (!on) btnLabel.textContent = 'Join video call';
    }
  </script>
</body>
</html>
